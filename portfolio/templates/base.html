{% load static i18n%}
{% get_current_language as LANGUAGE_CODE %}
{% get_current_language_bidi as LANGUAGE_BIDI %}
{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ali | Django Developer{% endblock %}</title>

    <!-- 1. Google Fonts: Inter (EN) and Vazirmatn (FA) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- 2. FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 3. Tailwind CSS + Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // We might use this later
            theme: {
                extend: {
                    fontFamily: {
                        // Define our custom font stacks
                        sans: ['Inter', 'sans-serif'], 
                        persian: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Royal Blue
                        dark: '#0f172a',    // Slate 900
                    }
                }
            }
        }
    </script>
</head>

<!-- 
    DYNAMIC BODY CLASSES:
    1. If Language is Farsi ('fa'): Apply 'font-persian'
    2. If Language is English: Apply 'font-sans'
    3. 'bg-gray-100' gives the bento boxes contrast 
-->
<body class="{% if LANGUAGE_CODE == 'fa' %}font-persian{% else %}font-sans{% endif %} bg-gray-100 text-gray-800 min-h-screen p-4 md:p-8">
    
    <!-- We don't need a traditional Navbar for Bento style. 
         The grid handles navigation. -->
    
    <main class="max-w-6xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
