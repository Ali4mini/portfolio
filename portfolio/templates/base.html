{% load static i18n%}
{% get_current_language as LANGUAGE_CODE %}
{% get_current_language_bidi as LANGUAGE_BIDI %}
{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ali | Django Developer{% endblock %}</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class', // This is crucial!
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'], 
                        persian: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', 
                        // We will rely on standard 'slate' colors for dark mode now
                        // to prevent config errors.
                    }
                }
            }
        }
    </script>

    <!-- Theme Logic -->
    <script>
        // 1. Initialize on load
        const initTheme = () => {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        };
        initTheme(); // Run immediately

        // 2. Toggle function (Global scope)
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }
    </script>
    <link rel="stylesheet" href="{% static 'css/patterns.css' %}">
</head>

<body class="{% if LANGUAGE_CODE == 'fa' %}font-persian{% else %}font-sans{% endif %} 
             bg-gray-50 text-gray-800 
             dark:bg-[#020617] dark:text-gray-200 
             transition-colors duration-300 min-h-screen p-4 md:p-8 relative">

   <div class="fixed inset-0 z-0 pointer-events-none">
        <!-- 1. The Glow (Bottom Layer) -->
        <div class="ambient-glow"></div>
        
        <!-- 2. The Dots (Top Layer) -->
        <div class="bg-dot-pattern"></div>
    </div>

    <main class="max-w-6xl mx-auto relative z-10">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
