{% load static i18n%}
{% get_current_language as LANGUAGE_CODE %}
{% get_current_language_bidi as LANGUAGE_BIDI %}
{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ali | Django Developer{% endblock %}</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class', // This is crucial!
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'], 
                        persian: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', 
                        // We will rely on standard 'slate' colors for dark mode now
                        // to prevent config errors.
                    }
                }
            }
        }
    </script>

    <!-- Theme Logic -->
    <script>
        // 1. Initialize on load
        const initTheme = () => {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        };
        initTheme(); // Run immediately

        // 2. Toggle function (Global scope)
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }
    </script>
<style>
    /* 1. SOPHISTICATED GRID (For the Main Background) */
    .bg-tech-grid {
        background-size: 50px 50px;
        background-image: 
            linear-gradient(to right, rgba(100, 116, 139, 0.1) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(100, 116, 139, 0.1) 1px, transparent 1px);
    }
    
    /* Dark mode grid adjustments (lighter lines) */
    .dark .bg-tech-grid {
        background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    /* 2. NOISE TEXTURE (For the Bento Boxes) */
    /* This creates that premium "matte" feel */
    .bg-noise {
        position: relative;
        overflow: hidden; /* Ensures noise doesn't spill out */
    }
    .bg-noise::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        opacity: 0.4; /* Adjusts how "grainy" it looks */
        pointer-events: none;
        z-index: 0;
    }
    /* Ensure content sits ABOVE the noise */
    .bg-noise > * {
        position: relative;
        z-index: 1;
    }
</style>
</head>

<body class="{% if LANGUAGE_CODE == 'fa' %}font-persian{% else %}font-sans{% endif %} 
             bg-gray-50 text-gray-800 
             dark:bg-[#020617] dark:text-gray-200 
             bg-tech-grid /* <--- Adds the Grid */
             transition-colors duration-300 min-h-screen p-4 md:p-8">
    
    <!-- We don't need a traditional Navbar for Bento style. 
         The grid handles navigation. -->
    
    <main class="max-w-6xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
